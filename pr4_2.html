<!doctype html>
<html>
  <head>
    <title>Practical 4_2</title>
    <style>
      h1 {
        color: darkblue;
        text-shadow: 10px 5px 7px gray;
      }
      .box {
        width: 500px;
        height: 150px;
        margin: 20px auto;
        color: white;
        font-size: 40px;
        background: linear-gradient(to right, rgb(248, 180, 91), rgb(187, 255, 0));
        box-shadow: 10px 10px 3px rgb(134, 125, 125);
      }
      .transform {
        width: 300px;
        height: 200px;
        background: rgb(97, 90, 202);
        color: rgb(118, 241, 102);
        margin: 30px auto;
        line-height: 100px;
        transform: rotate(-10deg) scale(1.1);
      }
      .vertical {
        writing-mode: vertical-lr;
        background: rgb(191, 194, 20);
        color: rgb(255, 17, 0);
        width: 60px;
        height: 180px;
        margin: auto;
        padding: 30px;
      }
    </style>
  </head>
  <body>
    <h1>CSS3 Demonstration</h1>
    <div class="box">Gradient + Shadow</div>

    <div class="transform">Transformation</div>

    <div class="vertical">Vertical Text</div>
  </body>
</html>
