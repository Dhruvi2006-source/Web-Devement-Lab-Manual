<!doctype html>
<html>
  <head>
    <title>Prac-6.1</title>
  </head>
  <body>
    <h2>JavaScript Event Listener</h2>
    <div
      id="box"
      style="
        width: 300px;
        height: 150px;
        border: 2px solid black;
      "
    >
      Mouse Movement effects shows here
    </div>
    <br />
    <input type="text" id="textbox" placeholder="Type" />
    <p id="output"></p>
    <script>
      let box = document.getElementById("box");
      let textbox = document.getElementById("textbox");
      let output = document.getElementById("output");

      box.addEventListener("mousemove", function () {
        output.innerHTML = "Mouse is moving inside the box.";
      });
      textbox.addEventListener("keyup", function () {
        output.innerHTML = "You typed : " + textbox.value;
      });
    </script>
  </body>
</html>
